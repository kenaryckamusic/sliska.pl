:root {
	color-scheme: dark;
	--ink: #0a0a0a;
	--paper: #f4f4f0;
	--muted: #9a9a96;
	--accent: #d53088;
	--rule: rgba(255, 255, 255, 0.15);
	font-family: Inter, sans-serif;
	background: var(--ink);
	color: var(--paper);
}

* { box-sizing: border-box; }
body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--ink); }
button, a { color: inherit; }
button { font: inherit; cursor: pointer; }
a { text-decoration: none; }
a:hover, button:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
[hidden] { display: none !important; }

.site-header { position: relative; z-index: 40; height: 64px; border-bottom: 1px solid var(--rule); }
.brand {
	position: absolute;
	top: 50%;
	left: 50vw;
	display: grid;
	justify-items: center;
	font: 800 14px/1.4 'Bricolage Grotesque', sans-serif;
	letter-spacing: .3em;
	text-transform: uppercase;
	transform: translate(-50%, -50%);
}
.brand small { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .45em; }
.menu-toggle {
	position: fixed;
	top: 0;
	left: 0;
	z-index: 61;
	display: grid;
	width: 64px;
	height: 64px;
	place-items: center;
	border: 0;
	background: var(--accent);
	color: var(--paper);
}
.menu-toggle:hover { color: var(--paper); background: #b82270; }
.menu-toggle--close { left: min(420px, calc(85vw - 64px)); font-size: 30px; line-height: 1; }
.home-link {
	position: absolute;
	top: 0;
	right: 0;
	z-index: 62;
	display: grid;
	width: 64px;
	height: 64px;
	place-items: center;
	border-left: 1px solid var(--rule);
	color: var(--paper);
}
.home-link:hover { background: rgba(255,255,255,.06); color: var(--paper); }
.site-menu {
	position: fixed;
	z-index: 60;
	inset: 0 auto 0 0;
	width: min(420px, 85vw);
	overflow: auto;
	padding: 64px 32px 32px 64px;
	background: #000;
	transform: translateX(-100%);
	transition: transform 260ms ease;
}
.site-menu.is-open { transform: translateX(0); }
.site-menu > a {
	display: block;
	padding: 18px 24px 18px 0;
	border-bottom: 3px solid #2a2a28;
	font: 500 21px/1.2 'Bricolage Grotesque', sans-serif;
	letter-spacing: .06em;
	text-transform: uppercase;
}
.site-menu > a[aria-current="page"] { color: var(--accent); }
.site-menu > a span { color: var(--muted); font: 14px Inter, sans-serif; }
.menu-contact {
	margin-top: 36px;
	padding-top: 20px;
	border-top: 1px solid var(--rule);
	color: var(--muted);
	font-size: 11px;
	letter-spacing: .2em;
	line-height: 1.9;
	text-transform: uppercase;
}
.menu-contact a { text-transform: none; }

.roster-intro { padding: 56px 56px 56px; text-align: center; }
.roster-intro h1 {
	margin: 0;
	font: 800 112px/.9 'Bricolage Grotesque', sans-serif;
	text-transform: uppercase;
}
.roster-intro h1 span { color: transparent; -webkit-text-stroke: 1px var(--paper); }
.roster { padding: 0 56px 96px; }
.artist-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.artist-card { min-width: 0; }
.artist-portrait {
	position: relative;
	aspect-ratio: 4 / 5;
	overflow: hidden;
	border: 1px solid var(--rule);
	background: #222220;
}
.artist-photo { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: transform 400ms ease; }
.artist-card:hover .artist-photo { transform: scale(1.035); }
.artist-placeholder {
	position: absolute;
	inset: 0;
	display: none;
	align-items: flex-end;
	padding: 14px;
	background: linear-gradient(145deg, #191918, #30302d 55%, #1b1b1a);
	color: var(--muted);
	font-size: 10px;
	letter-spacing: .2em;
	text-transform: uppercase;
}
.artist-portrait.is-missing .artist-placeholder { display: flex; }
.artist-details { padding: 16px 12px 18px; background: var(--paper); color: var(--ink); text-align: center; }
.artist-details h2 {
	min-height: 40px;
	display: flex;
	align-items: center;
	justify-content: center;
	margin: 0;
	font: 700 17px/1.15 'Bricolage Grotesque', sans-serif;
	text-transform: uppercase;
}
.artist-socials { display: flex; justify-content: center; gap: 16px; margin-top: 12px; }
.artist-socials a { display: flex; width: 18px; height: 18px; color: var(--ink); }
.artist-socials a:hover { color: var(--accent); }
.artist-socials svg { width: 18px; height: 18px; }

.site-footer {
	position: relative;
	min-height: 44px;
	display: flex;
	align-items: center;
	justify-content: space-between;
	border-top: 1px solid var(--rule);
	background: var(--ink);
	color: var(--muted);
	font-size: 11px;
}
.copyright, .legal-links { flex: 1; padding: 0 20px; }
.legal-links { text-align: right; white-space: nowrap; }
.legal-links a:hover { color: var(--accent); }
.fandom-link {
	display: flex;
	min-height: 44px;
	align-items: center;
	gap: 10px;
	padding: 0 20px;
	border-right: 1px solid var(--rule);
	border-left: 1px solid var(--rule);
	color: var(--paper);
	font-size: 12px;
	letter-spacing: .12em;
	text-transform: uppercase;
}
.grain {
	position: fixed;
	z-index: 50;
	inset: 0;
	pointer-events: none;
	opacity: .045;
	background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 83% 68%, #000 0 1px, transparent 1px 4px);
}

@media (max-width: 1100px) {
	.artist-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
	.artist-card { max-width: none; }
	.roster-intro h1 { font-size: 88px; }
}
@media (max-width: 700px) {
	.roster-intro { padding: 40px 24px; }
	.roster-intro h1 { font-size: 64px; }
	.roster { padding: 0 20px 56px; }
	.artist-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
	.artist-details { padding: 12px 8px 14px; }
	.artist-details h2 { font-size: 14px; }
	.site-menu { padding-left: 32px; }
	.site-footer { min-height: 80px; flex-wrap: wrap; justify-content: center; }
	.copyright { order: 2; flex: 1 0 100%; padding: 0 12px 10px; text-align: center; }
	.fandom-link { order: 0; min-height: 40px; border: 0; }
	.legal-links { order: 1; flex: 0 1 auto; padding: 0 12px; font-size: 10px; }
}
@media (max-width: 380px) {
	.artist-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
.site-header { height: 44px; }
.brand { font-size: clamp(.7rem, 2.8vw, .86rem); }
.menu-toggle { width: 44px; height: 44px; }
.menu-toggle--close { left: min(420px, calc(85vw - 44px)); }
.home-link { width: 44px; height: 44px; }

.fandom-link { min-height: 36px; font-size: .72rem; }

@media (max-width: 700px) {

	.fandom-link { min-height: 36px; }

.site-header { height: 50px; border-bottom: 0; }
.brand {

.site-menu { border-right: 1px solid var(--rule); border-radius: 0 0 20px 0; }
.artist-card { overflow: hidden; border: 1px solid var(--rule); border-radius: 16px; }
.artist-portrait { border: 0; border-radius: 0; }
.artist-details { border-radius: 0; }
@media (max-width: 700px) {

function renderSocialLinks(socials = {}) {
	const links = Object.entries(socialPlatforms).flatMap(([platform, social]) => {
		const href = socials[platform];
		if (typeof href !== 'string' || !href.trim()) return [];

		let url;
		try {
			url = new URL(href);
		} catch {
			return [];
		}
		if (!['http:', 'https:'].includes(url.protocol)) return [];

		return [`<a href="${url.href}" target="_blank" rel="noopener noreferrer" aria-label="${social.label}">${social.icon}</a>`];
	}).join('');

	return links ? `<div class="artist-socials">${links}</div>` : '';
}

artists.forEach((artist) => {
	const card = document.createElement('article');
	card.className = 'artist-card';
	const portrait = `
		<div class="artist-placeholder" aria-hidden="true">Zdjęcie czarno-białe</div>
		<img class="artist-photo" src="${artist.image}" alt="Portret: ${artist.name}" loading="lazy" decoding="async">
	`;

	card.innerHTML = `
		<div class="artist-portrait">${portrait}</div>
		<div class="artist-details">
			<h2>${artist.name}</h2>
			${renderSocialLinks(artist.socials)}
		</div>
	`;
	const image = card.querySelector('.artist-photo');
	image.addEventListener('error', () => {
		image.hidden = true;
		card.querySelector('.artist-portrait').classList.add('is-missing');
	}, { once: true });
	artistGrid.append(card);
});

function setMenuOpen(isOpen) {
	menu.inert = !isOpen;
	menu.classList.toggle('is-open', isOpen);
	openButton.hidden = isOpen;
	closeButton.hidden = !isOpen;
	openButton.setAttribute('aria-expanded', String(isOpen));
	closeButton.setAttribute('aria-expanded', String(isOpen));
	(isOpen ? closeButton : openButton).focus();
}

openButton.addEventListener('click', () => setMenuOpen(true));
closeButton.addEventListener('click', () => setMenuOpen(false));
document.addEventListener('keydown', (event) => {
	if (event.key === 'Escape' && !menu.inert) setMenuOpen(false);
});
</script>
