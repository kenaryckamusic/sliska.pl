<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#000000">
	<title>Śliska Music Group</title>
	<link rel="canonical" href="https://sliska.pl/smg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
	<style>
:root {
	color-scheme: dark;
	--ink: #000;
	--paper: #fff;
	--muted: #9a9a96;
	--accent: #d53088;
	--rule: rgba(255, 255, 255, 0.1);
	--display: 'Anton', 'Arial Narrow', sans-serif;
	font-family: Inter, sans-serif;
	background: var(--ink);
	color: var(--paper);
}

* { box-sizing: border-box; }

body {
	min-width: 320px;
	min-height: 100vh;
	margin: 0;
	background: var(--ink);
}

button, a { color: inherit; }
button { font: inherit; cursor: pointer; }
a { text-decoration: none; }
a:hover, button:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
[hidden] { display: none !important; }

.stage {
	position: relative;
	min-height: 640px;
	height: 100vh;
	overflow: hidden;
	background: #141412;
}
.site-header {
	position: absolute;
	top: 0;
	right: 0;
	left: 0;
	z-index: 40;
	height: 50px;
	pointer-events: none;
}

.slides, .slide { position: absolute; inset: 0; }
.slide {
	overflow: hidden;
	background: #141412;
	opacity: 0;
	transition: opacity 900ms cubic-bezier(.77, 0, .18, 1);
	pointer-events: none;
}
.artist-photo {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center 38%;
	filter: grayscale(1) brightness(.62);
	transform: scale(1.02);
	transition: transform 8s linear;
}
.slide.is-active .artist-photo { transform: scale(1.08); }
.slide::before {
	position: absolute;
	inset: 0;
	z-index: 1;
	background: linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.26) 55%, rgba(0,0,0,.46));
	content: "";
	pointer-events: none;
}
.slide.is-active { opacity: 1; }
.artist-name {
	position: absolute;
	z-index: 2;
	right: 0;
	bottom: 64px;
	left: 0;
	margin: 0;
	color: var(--paper);
	font: 400 clamp(2.1rem, 3.6vw, 2.9rem)/1.2 var(--display);
	letter-spacing: .24em;
	text-align: center;
	text-transform: uppercase;
	transform: translateY(24px);
	transition: transform 900ms cubic-bezier(.77, 0, .18, 1);
	text-shadow: 0 2px 20px rgba(0,0,0,.8);
}
.artist-name::after {
	display: block;
	width: 42px;
	height: 2px;
	margin: 14px auto 0;
	background: var(--accent);
	content: "";
}
.slide.is-active .artist-name { transform: translateY(0); }

.not-found {
	position: absolute;
	inset: 64px 0 44px;
	display: grid;
	align-content: center;
	justify-items: center;
	padding: 24px;
	text-align: center;
}
.not-found-code { margin: 0 0 14px; color: var(--muted); font-size: 12px; letter-spacing: .3em; }
.not-found h1 { margin: 0 0 24px; font: 800 48px/1.1 'Bricolage Grotesque', sans-serif; }
.not-found a { padding: 14px 20px; border: 1px solid var(--paper); font-size: 13px; }
.not-found a:hover { border-color: var(--accent); background: var(--accent); color: var(--paper); }

.brand {
	position: absolute;
	z-index: 10;
	top: 0;
	left: 50vw;
	display: grid;
	justify-items: center;
	padding: 7px 26px 9px;
	border: 1px solid var(--rule);
	border-top: 0;
	border-radius: 0 0 16px 16px;
	background: rgba(0,0,0,.3);
	-webkit-backdrop-filter: blur(14px) saturate(1.15);
	backdrop-filter: blur(14px) saturate(1.15);
	box-shadow: 0 6px 24px rgba(0,0,0,.18);
	font: 800 14px/1.4 'Bricolage Grotesque', sans-serif;
	letter-spacing: .3em;
	text-transform: uppercase;
	transform: translateX(-50%);
	pointer-events: auto;
}
.brand small {
	color: var(--muted);
	font-size: 10px;
	font-weight: 500;
	letter-spacing: .45em;
}

.menu-toggle {
	position: fixed;
	z-index: 61;
	top: 0;
	left: 0;
	display: grid;
	width: 64px;
	height: 64px;
	place-items: center;
	border: 0;
	border-right: 1px solid var(--rule);
	border-bottom: 1px solid var(--rule);
	border-radius: 0 0 16px 0;
	background: rgba(0,0,0,.3);
	color: var(--paper);
	-webkit-backdrop-filter: blur(14px) saturate(1.15);
	backdrop-filter: blur(14px) saturate(1.15);
	transition: background .2s, color .2s, border-color .2s;
}
.menu-toggle--open { color: var(--accent); }
.menu-toggle:hover { border-color: var(--accent); color: var(--paper); background: var(--accent); }
.menu-toggle--close { left: min(420px, calc(85vw - 64px)); font-size: 30px; line-height: 1; }
.home-link {
	position: absolute;
	top: 0;
	right: 0;
	z-index: 62;
	display: grid;
	width: 64px;
	height: 64px;
	place-items: center;
	border-left: 1px solid var(--rule);
	border-bottom: 1px solid var(--rule);
	border-radius: 0 0 0 16px;
	background: rgba(0,0,0,.3);
	color: var(--paper);
	-webkit-backdrop-filter: blur(14px) saturate(1.15);
	backdrop-filter: blur(14px) saturate(1.15);
	pointer-events: auto;
}
.home-link:hover { background: rgba(255,255,255,.06); color: var(--paper); }
.site-menu {
	position: fixed;
	z-index: 60;
	inset: 0 auto 0 0;
	width: min(420px, 85vw);
	overflow: auto;
	padding: 64px 32px 32px 64px;
	background: #000;
	transform: translateX(-100%);
	transition: transform 260ms ease;
}
.site-menu.is-open { transform: translateX(0); }
.site-menu > a {
	display: block;
	padding: 18px 24px 18px 0;
	border-bottom: 3px solid #2a2a28;
	font: 500 21px/1.2 'Bricolage Grotesque', sans-serif;
	letter-spacing: .06em;
	text-transform: uppercase;
}
.site-menu > a[aria-current="page"] { color: var(--accent); }
.site-menu > a span { color: var(--muted); font: 14px Inter, sans-serif; }
.menu-contact {
	margin-top: 36px;
	padding-top: 20px;
	border-top: 1px solid var(--rule);
	color: var(--muted);
	font-size: 11px;
	letter-spacing: .2em;
	line-height: 1.9;
	text-transform: uppercase;
}
.menu-contact a { text-transform: none; }

.slide-controls {
	position: absolute;
	z-index: 20;
	top: 50%;
	right: 0;
	display: flex;
	width: 56px;
	flex-direction: column;
	transform: translateY(-50%);
	overflow: hidden;
	border: 1px solid rgba(255,255,255,.1);
	border-right: 0;
	border-radius: 16px 0 0 16px;
	background: rgba(0,0,0,.3);
	-webkit-backdrop-filter: blur(10px);
	backdrop-filter: blur(10px);
}
.slide-controls button {
	height: 40px;
	border: 0;
	border-bottom: 1px solid rgba(255,255,255,.09);
	background: transparent;
	font-size: 20px;
}
.slide-controls button:last-child { border-bottom: 0; }
.slide-controls button:hover { background: rgba(255,255,255,.1); color: var(--paper); }

.site-footer {
	position: absolute;
	z-index: 10;
	right: 0;
	bottom: 0;
	left: 0;
	display: flex;
	min-height: 44px;
	align-items: center;
	justify-content: space-between;
	border-top: 1px solid rgba(255,255,255,.09);
	background: rgba(0,0,0,.34);
	color: var(--muted);
	font-size: 11px;
	-webkit-backdrop-filter: blur(10px);
	backdrop-filter: blur(10px);
}
.copyright, .legal-links { flex: 1; padding: 0 20px; }
.legal-links { text-align: right; white-space: nowrap; }
.legal-links a:hover { color: var(--accent); }
.fandom-link {
	display: flex;
	min-height: 44px;
	align-items: center;
	gap: 10px;
	padding: 0 20px;
	border-right: 1px solid var(--rule);
	border-left: 1px solid var(--rule);
	color: var(--paper);
	font-size: 12px;
	letter-spacing: .12em;
	text-transform: uppercase;
}
.grain {
	position: fixed;
	z-index: 50;
	inset: 0;
	pointer-events: none;
	opacity: .012;
	background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 83% 68%, #000 0 1px, transparent 1px 4px);
}

@media (max-width: 700px) {
	.stage { min-height: 560px; }
	.artist-name { bottom: 92px; padding: 0 58px; font-size: clamp(1.35rem, 6vw, 1.8rem); letter-spacing: .12em; }
	.site-footer { min-height: 80px; flex-wrap: wrap; justify-content: center; }
	.copyright { order: 2; flex: 1 0 100%; padding: 0 12px 10px; text-align: center; }
	.fandom-link { order: 0; min-height: 40px; border: 0; }
	.legal-links { order: 1; flex: 0 1 auto; padding: 0 12px; font-size: 10px; }
	.site-menu { padding-left: 32px; }
}

@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}


.site-header { height: 50px; }
.brand { font-size: clamp(.7rem, 2.8vw, .86rem); }
.menu-toggle { width: 44px; height: 44px; }
.menu-toggle--close { left: min(420px, calc(85vw - 44px)); }
.home-link { width: 44px; height: 44px; }
.site-footer { min-height: 36px; font-size: .72rem; }
.copyright, .legal-links { padding: 0 12px; }
.fandom-link { min-height: 36px; font-size: .72rem; }

@media (max-width: 700px) {
	.site-footer { min-height: 80px; }
	.copyright { padding: 0 1rem 10px; font-size: .68rem; }
	.fandom-link { min-height: 36px; }
	.legal-links { padding: 0 1rem; font-size: .68rem; }
}
</style>
