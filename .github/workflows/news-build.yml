name: Śliska News – strony artykułów

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wygeneruj strony
        run: node news/build/build.mjs

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "sliska-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Aktualizacja stron artykułów"
            git push
          fi

      - name: Wyślij nowe artykuły do Buffera (X / Twitter)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: node news/build/share.mjs

      - name: Zapisz listę wysłanych
        run: |
          git config user.name "sliska-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news/build/shared.json
          if git diff --cached --quiet; then echo "Brak zmian."; else git commit -m "Lista wysłanych artykułów"; git pull --rebase; git push; fi
