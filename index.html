<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotted Śliska 10</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --forest:#000;
  --frost:#fff;
  --display:'Anton','Arial Narrow',sans-serif;
  --ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--forest);color:var(--frost);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
p{margin:0}
a{color:inherit}

/* scena: jeden ekran, bez przewijania */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--forest)}
.stage__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 36%;filter:grayscale(1) contrast(1.03)}
.stage__mobile-image{display:none}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.22),rgba(0,0,0,.26) 55%,rgba(0,0,0,.46))}

/* napis w lewym dolnym rogu */
.title{position:absolute;left:clamp(1rem,4vw,2.5rem);bottom:calc(3.2rem + env(safe-area-inset-bottom,0px));margin:0;max-width:calc(100% - 2rem);
  font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,3.6vw,2.9rem);line-height:1.2;letter-spacing:.24em;text-align:left;color:var(--frost);
  text-shadow:0 1px 2px rgba(0,0,0,.28),0 4px 22px rgba(0,0,0,.4);opacity:0;animation:title-appear .9s ease-out .15s forwards}
.title__mobile{display:none}
@keyframes title-appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* cienki szklany panel u góry */
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10;width:fit-content;max-width:calc(100% - 20px);
  display:flex;justify-content:center;align-items:center;gap:clamp(.75rem,4vw,2.4rem);
  padding:calc(.5rem + env(safe-area-inset-top,0px)) clamp(.8rem,3vw,1.4rem) .55rem;
  background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
  border:1px solid rgba(255,255,255,.1);border-top:0;border-radius:0 0 16px 16px}
.nav a{position:relative;color:rgba(255,255,255,.94);text-decoration:none;font-weight:400;font-size:clamp(.7rem,2.8vw,.86rem);letter-spacing:0;white-space:nowrap;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:.1rem;height:1px;background:currentColor;opacity:0;transition:opacity .2s}
.nav a:hover::after,.nav a:focus-visible::after{opacity:.8}
.nav__group{display:grid;justify-items:center;line-height:1.15}
.nav__group .nav__sub-link{padding-top:0;font-size:.78em}

/* cienki dolny pasek */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:0 1.5rem;flex-wrap:wrap;
  padding:.15rem clamp(1rem,4vw,2.5rem) calc(.15rem + env(safe-area-inset-bottom,0px));
  background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.09);
  font-size:.72rem;color:rgba(244,246,241,.72)}
.bar__ig{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 0;color:var(--frost);font-weight:400;text-decoration:none}
.bar__ig:hover{opacity:.65}
.bar__ig svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.bar__ig .dot{fill:currentColor;stroke:none}
.nav a:focus-visible,.bar__ig:focus-visible{outline:1px solid #fff;outline-offset:4px;border-radius:2px}

/* telefony */
@media (max-width:560px){
  .nav{gap:.75rem;padding-left:.8rem;padding-right:.8rem}
  .nav a{font-size:clamp(.66rem,3vw,.8rem)}
  .title{right:0;left:0;bottom:calc(12rem + env(safe-area-inset-bottom,0px));max-width:none;font-size:clamp(1.65rem,8.5vw,2.4rem);letter-spacing:.12em;text-align:center}
  .title__desktop{display:none}
  .title__mobile{display:inline}
  .stage__video{display:none}
  .stage__mobile-image{display:block;object-position:42% 36%}
  .bar{justify-content:center;text-align:center;font-size:.68rem}
  .bar__rights{display:none}
}
@media (max-height:460px){
  .bar{flex-wrap:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .nav a::after{transition:none}
  .title{opacity:1;animation:none}
}
</style>
</head>
<body>

<nav class="nav" aria-label="Główna nawigacja">
  <div class="nav__group">
    <a href="/smg">Śliska Music Group</a>
    <a class="nav__sub-link" href="https://crackrecordings.pl/" target="_blank" rel="noopener noreferrer">CRACK Recordings</a>
  </div>
  <a href="https://sunopedia.fandom.com/pl/wiki/Sunopedia_Wiki" target="_blank" rel="noopener">Fandom Wiki</a>
</nav>

<main class="stage">
  <video class="stage__img stage__video" autoplay muted loop playsinline preload="metadata" controlslist="nodownload" disablepictureinpicture draggable="false" poster="img/sliska.jpg" aria-hidden="true">
    <source data-src="sliska.mp4" type="video/mp4">
  </video>
  <img class="stage__img stage__mobile-image" src="img/sliska2.jpg" alt="" draggable="false">
  <h1 class="title"><span class="title__desktop">WITAMY<br>NA ŚLISKIEJ</span><span class="title__mobile">WITAMY NA<br>ŚLISKIEJ</span></h1>
</main>

<footer class="bar">
  <p class="bar__copy">© 2026 Suno Community / Spotted Śliska 10<span class="bar__rights">. Wszelkie prawa zastrzeżone.</span></p>
  <a class="bar__ig" href="https://www.instagram.com/sliska.pl" target="_blank" rel="noopener" aria-label="Instagram: sliska.pl">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.4" cy="6.6" r="1.1" class="dot"/></svg>
    <span>sliska.pl</span>
  </a>
</footer>

<script>
const stage = document.querySelector('.stage');
const video = document.querySelector('.stage__video');
const source = video.querySelector('source');
const mobileScreen = window.matchMedia('(max-width:560px)');

function updateBackgroundVideo() {
  if (mobileScreen.matches) {
    video.pause();
    source.removeAttribute('src');
    video.load();
  } else if (source.getAttribute('src') !== source.dataset.src) {
    source.src = source.dataset.src;
    video.load();
  }
}

stage.addEventListener('contextmenu', event => event.preventDefault());
mobileScreen.addEventListener('change', updateBackgroundVideo);
updateBackgroundVideo();
</script>
</body>
</html>
