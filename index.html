<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamara Kenarycka</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Tło z okładką -->
    <div class="background">
        <div class="gradient-overlay"></div>
    </div>

    <!-- Logo SSM Label (lewy górny róg) -->
    <a href="https://ssmlabel.pl" class="ssm-label" target="_blank">SSM Label</a>

    <!-- Copyright (prawy górny róg) -->
    <div class="copyright-top">
        <span class="copyright-full">ALL RIGHTS RESERVED. UNAUTHORIZED DUPLICATION IS A VIOLATION OF APPLICABLE LAWS.<br>
        SSM LABEL & JESS JESSICA RECORDING COMPANY.<br>
        © <span id="year">2026</span> TAMARA KENARYCKA</span>
        <span class="copyright-mobile">© <span id="year-mobile">2026</span> TAMARA KENARYCKA</span>
    </div>

    <!-- Główna zawartość po lewej stronie -->
    <div class="left-content">
        <!-- Sekcja singla Fantazje -->
        <div class="single-section">
            <div class="single-badge">NOWY SINGIEL</div>
            <div class="single-title single-title-bg"></div>
            <a href="https://mugo.lnk.to/spadektamarakenarycka" target="_blank" rel="noopener noreferrer" class="single-listen-btn">POSŁUCHAJ TERAZ</a>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/kenarycka.music/" target="_blank" class="social-btn instagram">Instagram</a>
            <a href="https://www.tiktok.com/@tamarakenarycka_" target="_blank" class="social-btn tiktok">TikTok</a>
            <a href="https://www.youtube.com/@TamaraKenarycka" target="_blank" class="social-btn youtube">YouTube</a>
        </div>
    </div>

    <!-- Przycisk Streamingi (prawy dolny róg) -->
    <div class="bottom-right">
        <button class="streaming-toggle">STREAMING</button>
    </div>

    <!-- Modal z linkami do streamingu -->
    <div class="streaming-modal" id="streamingModal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <h3>Słuchaj teraz</h3>
            <a href="https://open.spotify.com/artist/0LStwz5X9rmEdyh4BLroZN?si=9oZda7gYQC2uauJDLIq4Sg" target="_blank" class="streaming-link spotify">Spotify</a>
            <a href="https://music.apple.com/pl/artist/tamara-kenarycka/1807642953" target="_blank" class="streaming-link apple">Apple Music</a>
            <a href="https://music.youtube.com/channel/UCD9-ObzjTTCeRc3T6OoZ6Eg" target="_blank" class="streaming-link youtube">YouTube Music</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
