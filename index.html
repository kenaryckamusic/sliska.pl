<style>
:root{
  color-scheme:dark;
  --forest:#000;
  --frost:#fff;
  --display:'Anton','Arial Narrow',sans-serif;
  --news:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --accent:#d6001c;
  --ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--forest);color:var(--frost);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
p{margin:0}
a{color:inherit}

/* scena: jeden ekran, bez przewijania */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--forest)}
.stage__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 36%;filter:grayscale(1) contrast(1.03)}
.stage__mobile-image{display:none}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.22),rgba(0,0,0,.26) 55%,rgba(0,0,0,.46))}

/* ramka jak na grafikach Śliska News */
.frame{position:fixed;inset:18px;z-index:5;border:1.5px solid rgba(255,255,255,.22);border-radius:28px;pointer-events:none}

/* blok w lewym dolnym rogu: kicker, napis i przycisk do Śliska News */
.hero{position:absolute;left:clamp(1.6rem,5vw,3.4rem);bottom:calc(4.4rem + env(safe-area-inset-bottom,0px));max-width:calc(100% - 3rem);opacity:0;animation:title-appear .9s ease-out .15s forwards}
.kicker{display:flex;align-items:center;gap:.9rem;margin:0 0 1rem;font-family:var(--news);font-weight:800;font-size:clamp(.62rem,1.5vw,.78rem);letter-spacing:.17em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.kicker i{display:block;width:2.6rem;height:4px;background:var(--accent)}
.title{margin:0;font-family:var(--news);font-weight:900;font-size:clamp(2.4rem,6.2vw,5.4rem);line-height:1.02;letter-spacing:-.025em;text-align:left;color:var(--frost);
  text-shadow:0 1px 2px rgba(0,0,0,.28),0 4px 22px rgba(0,0,0,.4)}
.title__mobile{display:none}
.cta{display:inline-flex;align-items:center;gap:.6rem;margin-top:1.6rem;padding:.85rem 1.5rem;border-radius:999px;color:#fff;text-decoration:none;font-family:var(--news);font-weight:800;font-size:.95rem;letter-spacing:.01em;
  background:linear-gradient(135deg,#f2002a,#8a0014);box-shadow:0 10px 30px rgba(214,0,28,.38);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(214,0,28,.5)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes title-appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* panel nawigacji: prosta szklana pigułka, osadzona na górnej linii ramki */
.nav{position:fixed;top:calc(38px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10;width:fit-content;max-width:calc(100% - 64px);
  display:flex;justify-content:center;align-items:center;gap:clamp(.75rem,4vw,2.4rem);padding:.55rem clamp(1rem,3vw,1.8rem);
  background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.nav a{position:relative;color:rgba(255,255,255,.94);text-decoration:none;font-weight:400;font-size:clamp(.7rem,2.8vw,.86rem);letter-spacing:0;white-space:nowrap;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:.1rem;height:1px;background:currentColor;opacity:0;transition:opacity .2s}
.nav a:hover::after,.nav a:focus-visible::after{opacity:.8}
.nav a.nav__logo{display:inline-flex;align-items:center;padding:.1rem 0}
.nav a.nav__logo::after{display:none}
.nav__logo-svg{display:block;height:clamp(15px,4.2vw,19px);width:auto;aspect-ratio:732/128}
.nav a.nav__logo:hover{opacity:.75}
.nav__group{display:grid;justify-items:center;line-height:1}
.nav__group a{padding:.1rem 0;line-height:1}
.nav__group .nav__sub-link{padding:0;font-size:.7em}

/* cienki dolny pasek */
.bar{position:fixed;left:18px;right:18px;bottom:18px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:0 1.5rem;flex-wrap:wrap;
  padding:.35rem clamp(1.4rem,3.4vw,2.2rem) calc(.35rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0));border-radius:0 0 26px 26px;
  font-size:.72rem;color:rgba(244,246,241,.72)}
.bar__ig{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem 0;color:var(--frost);font-weight:400;text-decoration:none}
.bar__ig:hover{opacity:.65}
.bar__ig svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.bar__ig .dot{fill:currentColor;stroke:none}
.nav a:focus-visible,.bar__ig:focus-visible{outline:1px solid #fff;outline-offset:4px;border-radius:2px}

/* komputery: logo dokładnie na środku panelu */
/* telefony */
@media (max-width:560px){
  .frame{inset:12px;border-radius:24px}
  .nav{top:calc(28px + env(safe-area-inset-top,0px));gap:.7rem;padding:.5rem .95rem;max-width:calc(100% - 40px)}
  .nav a{font-size:.66rem}
  .nav__logo-svg{height:14px}
  .hero{right:0;left:0;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));max-width:none;padding:0 1.6rem;text-align:center}
  .kicker{justify-content:center;gap:.6rem}.kicker i{width:1.6rem}
  .title{font-size:clamp(2.1rem,11vw,3.2rem);text-align:center}
  .cta{margin-top:1.3rem}
  .title__desktop{display:none}
  .title__mobile{display:inline}
  .stage__video{display:none}
  .stage__mobile-image{display:block;object-position:42% 36%}
  .bar{left:12px;right:12px;bottom:12px;border-radius:0 0 22px 22px;justify-content:center;text-align:center;font-size:.68rem}
  .bar__rights{display:none}
}
@media (max-height:460px){
  .bar{flex-wrap:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .nav a::after{transition:none}
  .hero{opacity:1;animation:none}
}
</style>

<script>
const stage = document.querySelector('.stage');
const video = document.querySelector('.stage__video');
const source = video.querySelector('source');
const mobileScreen = window.matchMedia('(max-width:560px)');

function updateBackgroundVideo() {
  if (mobileScreen.matches) {
    video.pause();
    source.removeAttribute('src');
    video.load();
  } else if (source.getAttribute('src') !== source.dataset.src) {
    source.src = source.dataset.src;
    video.load();
  }
}

stage.addEventListener('contextmenu', event => event.preventDefault());
mobileScreen.addEventListener('change', updateBackgroundVideo);
updateBackgroundVideo();
</script>
