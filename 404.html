<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Nie znaleziono strony | Spotted Śliska 10</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:dark;
  --frost:#fff;
  --display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--frost);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;padding:5rem 1.5rem;background:#000}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.62)),url("/img/sliska.jpg") center 36%/cover;filter:grayscale(1)}
.content{position:relative;width:min(100%,36rem);text-align:center}
.code{margin:0;font-family:var(--display);font-size:clamp(7rem,25vw,13rem);font-weight:900;line-height:.9;letter-spacing:-.04em;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.message{margin:1.5rem 0 0;font-size:clamp(1rem,3vw,1.2rem);line-height:1.6;color:rgba(255,255,255,.82)}
.home{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:2rem;padding:.7rem 1.4rem;border:0;border-radius:999px;background:#d6001c;box-shadow:0 10px 30px rgba(214,0,28,.38);font-size:.95rem;font-weight:800;text-decoration:none;transition:background .2s,border-color .2s,color .2s}
.home:hover{background:#a80016}
.home:focus-visible{outline:2px solid #fff;outline-offset:4px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:.65rem 1rem calc(.65rem + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.34);text-align:center;font-size:.72rem;color:rgba(244,246,241,.72)}
body.smg-page .stage::before{background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.42) 55%,rgba(0,0,0,.68)),url("/smg/img/tamarakenarycka.jpg") center 38%/cover;filter:grayscale(1) brightness(.72)}
body.smg-page .code{color:#fff}



@media (max-width:560px){body:not(.smg-page) .stage::before{background-image:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.62)),url("/img/sliska2.jpg")}}
@media (prefers-reduced-motion:reduce){.home{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <section class="content" aria-labelledby="error-title">
    <h1 class="code" id="error-title">404</h1>
    <p class="message" id="error-message">Wygląda na to, że ta strona nie istnieje albo została przeniesiona.</p>
    <a class="home" id="home-link" href="/">Wróć na stronę główną</a>
  </section>
</main>
<footer class="bar" id="footer">© 2026 Suno Community / Spotted Śliska 10</footer>
<script>
const isSmgPage = /^\/smg(?:\/|$)/.test(window.location.pathname);

if (isSmgPage) {
  document.body.classList.add('smg-page');
  document.getElementById('home-link').href = '/smg/';
  document.getElementById('footer').textContent = '© 2026 Śliska Music Group. Wszelkie prawa zastrzeżone.';
}
</script>
</body>
</html>
